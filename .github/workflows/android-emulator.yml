# Android 計装テスト (AVD 試験) を GitHub Actions のエミュレータ (ReactiveCircus/android-emulator-runner) で実行する。docs/ci.md
# FS グループごとに matrix で分け、最大 4 並列で動かす。各ジョブが独立にビルド・フィクスチャ生成・エミュレータ起動を行う。
name: Android emulator tests

on:
  workflow_dispatch:
    inputs:
      groups:
        description: 'グループを 1 つだけ実行する (空 = 全部)。例: crypt-ui。(既定ブランチにワークフローが無い運用では push のブランチ名 usbmem-ci-only-<グループ> を使う)'
        required: false
        default: ''
  push:
    branches: [usbmem-ci, 'usbmem-ci-*', '!usbmem-ci-apk', '!usbmem-ci-apk-*', '!usbmem-ci-kfsd-*']

concurrency:
  group: android-emulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  API_LEVEL: 34
  # android/app/build.gradle.kts の ndkVersion / externalNativeBuild.cmake.version と合わせる
  NDK_VERSION: 30.0.16248370
  CMAKE_VERSION: 4.1.2
  SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  # AndroidManifest の権限・機能・コンポーネントの宣言漏れをソースの API 使用と突き合わせる (数秒)。ビルド・エミュレータは要らない。
  # 計装テストは偽の vault を差すので USE_BIOMETRIC の漏れに気づけなかった、の再発防止 (docs/ci.md)。matrix のジョブとは独立 (落ちても他は走る)。
  manifest:
    name: manifest permissions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check AndroidManifest permissions
        run: |
          python3 -I tools/test_check_manifest_permissions.py
          python3 -I tools/check_manifest_permissions.py

  android:
    name: android (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # グループの中身は tools/ci_android_tests.sh の group_fs() を参照
        group: ${{ fromJSON(inputs.groups && format('["{0}"]', inputs.groups) || endsWith(github.ref_name, '-only-crypt-ui') && '["crypt-ui"]' || endsWith(github.ref_name, '-only-disk-ui') && '["disk-ui"]' || endsWith(github.ref_name, '-only-smb') && '["smb"]' || endsWith(github.ref_name, '-only-ro-misc') && '["ro-misc"]' || endsWith(github.ref_name, '-only-wim-fuse') && '["wim-fuse"]' || endsWith(github.ref_name, '-only-kfsd') && '["kfsd"]' || '["ext-fat","btrfs-xfs","squash-erofs","nested-ntfs","ro-misc","crypt-ui","disk-ui","smb","wim-fuse","kfsd"]') }}
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle (依存ライブラリとラッパー) と SDK の追加分 (NDK / CMake) は全ジョブ共通のキーでキャッシュする
      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: SDK cache (NDK / CMake / platform)
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.SDK_ROOT }}/cmake/${{ env.CMAKE_VERSION }}
            ${{ env.SDK_ROOT }}/platforms/android-36
            ${{ env.SDK_ROOT }}/build-tools/36.0.0
          key: sdk-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-p36

      - name: Install SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      # ホスト側ツール: フィクスチャの生成と、書き込み結果の独立検証に使う (docs/ci.md の一覧)
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            e2fsprogs fuse2fs fuse3 mtools p7zip-full dosfstools exfatprogs exfat-fuse ntfs-3g \
            btrfs-progs xfsprogs f2fs-tools erofs-utils squashfs-tools zstd lzop lz4 xz-utils \
            gdisk fdisk gcc python3 bc genisoimage xorriso cryptsetup-bin python3-cryptography python3-numpy
          # 非 root の FUSE マウント (fuse2fs / exfat-fuse / ntfs-3g) が allow_other を付けるので、fusermount3 に許可する
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          for t in mke2fs e2fsck fuse2fs mformat 7z mkfs.fat mkfs.exfat fsck.exfat mount.exfat-fuse mkntfs ntfs-3g \
                   mkfs.btrfs btrfs mkfs.xfs xfs_repair mkfs.f2fs sload.f2fs fsck.f2fs mkfs.erofs fsck.erofs mksquashfs unsquashfs sgdisk sfdisk genisoimage xorriso isoinfo cryptsetup; do
            command -v "$t" >/dev/null || [ -x "/sbin/$t" ] || [ -x "/usr/sbin/$t" ] || echo "::warning::host tool missing: $t"
          done

      # SMB (docs/smb.md。smb グループだけ): runner 上の Samba へ、エミュレータが 10.0.2.2:4445 で接続する。system の smbd / nmbd は止めて、試験用の設定 (tmpfs・ポート 4445) の smbd だけを tools/ci_android_tests.sh が立てる
      - name: Install Samba (smb only)
        if: matrix.group == 'smb'
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends samba smbclient
          sudo systemctl stop smbd nmbd samba-ad-dc 2>/dev/null || true
          sudo systemctl disable smbd nmbd 2>/dev/null || true
          command -v smbd smbpasswd smbclient testparm
          df -h /dev/shm

      # 個人版の FUSE 層 (wimfuse。wim-fuse グループだけ): libwimfuse.so (wimlib の wimmount を載せた別プロセスの実行ファイル) を NDK で作り、APK の jniLibs に入れる (docs/fuse-layer.md 10 章)
      - name: Build libwimfuse.so (wim-fuse only)
        if: matrix.group == 'wim-fuse'
        run: |
          sudo apt-get install -y --no-install-recommends libfuse3-dev wimtools ninja-build
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/$NDK_VERSION"
          tools/wimfuse/build_android.sh "$RUNNER_TEMP/wimfuse" 2>&1 | tee "$RUNNER_TEMP/wimfuse_build.log"
          test "${PIPESTATUS[0]}" = 0
          mkdir -p ci-logs && cp "$RUNNER_TEMP/wimfuse_build.log" ci-logs/

      # NTFS / ext2 / exFAT の書き込みテストに -PusbmemNtfsWrite=true が要る (ABI は arm64-v8a と x86_64 の両方がビルドされる)
      - name: Build APKs
        working-directory: android
        run: |
          ../tools/ci/retry_gradle.sh ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PusbmemNtfsWrite=true ${{ matrix.group == 'wim-fuse' && format('-PusbmemWimFuse={0}/wimfuse', runner.temp) || '' }} ${{ matrix.group == 'kfsd' && '-PusbmemKfsd=true :kfsd-plugin:assembleDebug -PusbmemPluginAbis=x86_64' || '' }}
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} +

      # kfsd (docs/kfsd.md): libkfsd.so (PIE の実行ファイル) が APK に入ること (AGP が実行ファイルを *.so として梱包するか) を、エミュレータの前に確かめる。プラグイン APK も同じ
      - name: Check kfsd in APKs (kfsd only)
        if: matrix.group == 'kfsd'
        working-directory: android
        run: |
          set -x
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E 'lib/(x86_64|arm64-v8a)/lib(kfsd|kfsdspawn)\.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -c 'lib/x86_64/libkfsd.so' | grep -qx 1
          unzip -l kfsd-plugin/build/outputs/apk/debug/kfsd-plugin-debug.apk | grep -E 'lib/x86_64/lib(kfsd|kfsdspawn)\.so'
          unzip -l kfsd-plugin/build/outputs/apk/debug/kfsd-plugin-debug.apk | grep -c 'lib/x86_64/libkfsd.so' | grep -qx 1
          ls -l kfsd-plugin/build/outputs/apk/debug/

      # JVM 単体試験 (パスワードの記憶 SecretVault。Android / Keystore に依存しない部分)。他の単体試験は CI で動かしていないので、この 1 クラスだけ
      - name: JVM unit tests (VaultTest)
        if: matrix.group == 'crypt-ui'
        working-directory: android
        run: ../tools/ci/retry_gradle.sh ./gradlew --no-daemon :app:testDebugUnitTest --tests 'org.usbmem.app.VaultTest' -PusbmemNtfsWrite=true

      # SMB の JVM 単体試験 (設定・パス・例外の分類・コピーの取り消しなど、サーバーに依らない部分)
      - name: JVM unit tests (smb)
        if: matrix.group == 'smb'
        working-directory: android
        run: ../tools/ci/retry_gradle.sh ./gradlew --no-daemon :app:testDebugUnitTest --tests 'org.usbmem.app.smb.*' -PusbmemNtfsWrite=true

      # SMBJ 追加による release APK (R8) のサイズ増加と、R8 の警告 (欠けたクラス) の確認。docs/smb.md に記録する
      - name: Release APK size (smb only)
        if: matrix.group == 'smb'
        continue-on-error: true   # 失敗しても計装試験は続ける (結果は step の失敗として見える)
        run: tools/ci/smb_apk_size.sh

      - name: Generate fixtures
        run: tools/ci_android_tests.sh gen ${{ matrix.group }}

      - name: AVD cache
        id: avd-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ runner.os }}-api${{ env.API_LEVEL }}-google_apis-x86_64-v5

      - name: Create AVD and snapshot (cache miss only)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run instrumented tests on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 3
          ram-size: 3072M
          disk-size: 8192M
          force-avd-creation: false
          emulator-options: -no-window -no-audio -no-snapshot-save -gpu swiftshader_indirect -no-boot-anim -camera-back none
          disable-animations: true
          script: tools/ci_android_tests.sh run ${{ matrix.group }}

      # 手元の AVD で試せるよう、wim-fuse のときだけ APK (libwimfuse.so 入り) も残す
      - name: Upload APKs (wim-fuse only)
        if: matrix.group == 'wim-fuse' && always()
        uses: actions/upload-artifact@v7
        with:
          name: apks-wim-fuse
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.group }}
          path: ci-logs/
          if-no-files-found: ignore
          retention-days: 14
