# 実機試験用の APK (書き込み有効ビルド + 計装テスト APK) を作り、アーティファクトとして取り出す。docs/ci.md
# ローカルの Gradle ビルドは重く、Data の書き戻し停止の原因になりうるので、実機に入れる APK はここで作る。
# 使い方: git push https://github.com/kawanakaiku/test-ci.git HEAD:refs/heads/usbmem-ci-apk → gh run download <run-id> -n apks
name: Build APKs

on:
  workflow_dispatch:
  push:
    branches: ['usbmem-ci-apk', 'usbmem-ci-apk-*']

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # android/app/build.gradle.kts の ndkVersion / externalNativeBuild.cmake.version と合わせる (android-emulator.yml と同じ)
  NDK_VERSION: 30.0.16248370
  CMAKE_VERSION: 4.1.2
  SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: SDK cache (NDK / CMake / platform)
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.SDK_ROOT }}/cmake/${{ env.CMAKE_VERSION }}
            ${{ env.SDK_ROOT }}/platforms/android-36
            ${{ env.SDK_ROOT }}/build-tools/36.0.0
          key: sdk-${{ runner.os }}-ndk${{ env.NDK_VERSION }}-cmake${{ env.CMAKE_VERSION }}-p36

      - name: Install SDK components
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          SM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SM" --licenses >/dev/null || true
          "$SM" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION"

      - name: Build APKs (write-enabled)
        working-directory: android
        run: |
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest -PusbmemNtfsWrite=true
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} +

      - name: Collect
        run: |
          mkdir -p apks
          cp android/app/build/outputs/apk/debug/*.apk apks/
          cp android/app/build/outputs/apk/androidTest/debug/*.apk apks/
          git rev-parse HEAD > apks/COMMIT.txt
          ls -l apks

      - uses: actions/upload-artifact@v7
        with:
          name: apks
          path: apks/
          retention-days: 7
