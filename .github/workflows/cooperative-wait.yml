name: 協調停止の待機計測
on:
  push:
    branches: [xtajit4-cooperative-wait]
jobs:
  probe:
    runs-on: windows-11-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Windows と Prism の版
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          (Get-Item C:\Windows\System32\xtajit64.dll).VersionInfo.FileVersion
      - name: 待機中の協調停止を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\cooperative-wait.exe -NoNewWindow -PassThru -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          if (-not $p.WaitForExit(100000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content out.txt
          Get-Content err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: XSTATE を指定した文脈取得を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\cooperative-wait.exe -ArgumentList xstate -NoNewWindow -PassThru -RedirectStandardOutput xstate.txt -RedirectStandardError xstate-err.txt
          if (-not $p.WaitForExit(100000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content xstate.txt
          Get-Content xstate-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: 実際の並列翻訳の停止を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\translation-wait.exe -NoNewWindow -PassThru -RedirectStandardOutput translation.txt -RedirectStandardError translation-err.txt
          if (-not $p.WaitForExit(100000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content translation.txt
          Get-Content translation-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Doorbell の他ビットの保持を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\doorbell-bits.exe -NoNewWindow -PassThru -RedirectStandardOutput bits.txt -RedirectStandardError bits-err.txt
          if (-not $p.WaitForExit(100000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content bits.txt
          Get-Content bits-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: 協調停止中のイベント成立を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\cooperative-event.exe -NoNewWindow -PassThru -RedirectStandardOutput event.txt -RedirectStandardError event-err.txt
          if (-not $p.WaitForExit(110000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content event.txt
          Get-Content event-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: 停止予約なしの空フラグ復元を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\continue-flags.exe -NoNewWindow -PassThru -RedirectStandardOutput continue.txt -RedirectStandardError continue-err.txt
          if (-not $p.WaitForExit(35000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content continue.txt
          Get-Content continue-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: x64コードへの空フラグ復元を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\continue-flags-x64.exe -NoNewWindow -PassThru -RedirectStandardOutput continue-x64.txt -RedirectStandardError continue-x64-err.txt
          if (-not $p.WaitForExit(35000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content continue-x64.txt
          Get-Content continue-x64-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: 拡張領域の長さごとの復元を測定
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe\continue-xstate.exe -NoNewWindow -PassThru -RedirectStandardOutput cx.txt -RedirectStandardError cx-err.txt
          if (-not $p.WaitForExit(35000)) { $p.Kill(); 'TIMEOUT' }
          Get-Content cx.txt
          Get-Content cx-err.txt
          "exit=$($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
