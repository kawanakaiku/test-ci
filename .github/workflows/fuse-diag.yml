# 一時的な診断 (FUSE がランナーで使えるか)。確認後に削除する
name: FUSE diagnostics
on:
  push:
    branches: [usbmem-ci]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends e2fsprogs fuse2fs fuse3 exfatprogs exfat-fuse ntfs-3g gcc python3
      - name: Info
        run: |
          fusermount3 -V; ls -l /dev/fuse /usr/bin/fusermount3 /usr/bin/ntfs-3g /usr/bin/fuse2fs /sbin/mount.exfat-fuse /usr/sbin/mount.exfat-fuse 2>&1 || true
          cat /etc/fuse.conf; id; fuse2fs --version 2>&1 | head -3
      - name: ext2 fuse2fs
        run: |
          set +e
          D=$(mktemp -d); truncate -s 16M $D/a.img; mke2fs -q -t ext2 $D/a.img; mkdir $D/m
          fuse2fs -o rw,fakeroot $D/a.img $D/m; echo "rc=$?"
          mount | grep fuse; ls -la $D/m; touch $D/m/x; echo "touch rc=$?"
          fusermount3 -u $D/m; echo "umount rc=$?"
          echo "--- without fakeroot"
          fuse2fs -o rw $D/a.img $D/m; echo "rc=$?"; fusermount3 -u $D/m
          echo "--- -f debug"; (timeout 5 fuse2fs -f -o rw,fakeroot $D/a.img $D/m 2>&1 | head -20)
      - name: exfat fuse
        run: |
          set +e
          D=$(mktemp -d); truncate -s 24M $D/a.img; mkfs.exfat -q $D/a.img; mkdir $D/m
          gcc -shared -fPIC -O1 -o $D/shim.so tools/exfat_fuse_shim.c -ldl; echo "gcc rc=$?"
          LD_PRELOAD=$D/shim.so mount.exfat-fuse -o rw $D/a.img $D/m; echo "shim rc=$?"
          mount | grep fuse; fusermount3 -u $D/m
          mount.exfat-fuse -o rw $D/a.img $D/m; echo "noshim rc=$?"
          mount | grep fuse; fusermount3 -u $D/m
      - name: ntfs-3g
        run: |
          set +e
          D=$(mktemp -d); truncate -s 32M $D/a.img; mkntfs -F -Q -q $D/a.img; mkdir $D/m
          ntfs-3g -o ro $D/a.img $D/m; echo "rc=$?"
          mount | grep -E 'fuse|ntfs'; fusermount3 -u $D/m; echo "fusermount3 -u rc=$?"
          mount | grep -E 'fuse|ntfs'
          umount $D/m 2>&1; echo "umount rc=$?"; sudo umount $D/m; echo "sudo umount rc=$?"
          echo "--- after chmod u-s"
          sudo chmod u-s /usr/bin/ntfs-3g
          ntfs-3g -o ro $D/a.img $D/m; echo "rc=$?"; mount | grep -E 'fuse|ntfs'; fusermount3 -u $D/m; echo "fusermount3 -u rc=$?"
