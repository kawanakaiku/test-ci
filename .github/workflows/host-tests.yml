# ホスト (x86_64 Linux) の ctest を 4 構成で実行する: plain / san (ASan+UBSan) / wsan (書き込み有効+san) / wrel (書き込み有効 release)。
# 手元のメモリが足りないときに、重い 4 構成を GitHub Actions へ逃がすために使う。docs/ci.md
# トリガ: workflow_dispatch (ctest_regex で絞れる)、または usbmem-ci* ブランチへの push。
name: Host tests

on:
  workflow_dispatch:
    inputs:
      ctest_regex:
        description: "ctest -R に渡す正規表現 (空なら全件)"
        required: false
        default: ""
  push:
    branches: ['usbmem-ci*']

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host:
    name: host (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: [plain]
    steps:
      - uses: actions/checkout@v7

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 e2fsprogs fuse2fs fuse3 mtools p7zip-full dosfstools exfatprogs exfat-fuse ntfs-3g \
            btrfs-progs xfsprogs f2fs-tools erofs-utils squashfs-tools zstd lzop lz4 xz-utils \
            gdisk fdisk bc genisoimage xorriso cryptsetup-bin nbdkit libnbd-bin qemu-utils partclone gddrescue zlib1g-dev
          echo user_allow_other | sudo tee -a /etc/fuse.conf

      # ubuntu 26.04 の runner は AppArmor の fusermount3 プロファイルが FUSE のマウント / アンマウントを /home・/mnt・/media・/tmp・/run/user の下に限る。
      # テストのフィクスチャ・作業場所は /dev/shm なので、fuse2fs / exfat-fuse の mount が "fusermount3: mount failed: Permission denied"、
      # ntfs-3g の mount 後の fusermount3 -u が "Operation not permitted" になる。ローカル上書き (local/fusermount3) で /dev/shm を足す。
      - name: shm diag
        run: |
          set +e
          sudo mount -t tmpfs -o size=10G,mode=1777,nosuid,nodev tmpfs /dev/shm; echo rc=$?; mount | grep " /dev/shm "
          dd if=/dev/zero of=/dev/shm/fill bs=1M count=9000 2>&1 | tail -1; df -h /dev/shm; rm -f /dev/shm/fill
          mount | grep " /dev/shm "
