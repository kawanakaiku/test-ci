# ホスト (x86_64 Linux) の ctest を 4 構成で実行する: plain / san (ASan+UBSan) / wsan (書き込み有効+san) / wrel (書き込み有効 release)。
# 手元のメモリが足りないときに、重い 4 構成を GitHub Actions へ逃がすために使う。docs/ci.md
# トリガ: workflow_dispatch (ctest_regex と modes で絞れる)、または usbmem-ci* ブランチへの push。
# 待ち時間を減らす工夫 (docs/ci.md):
#   - push で動かす構成はブランチ名で決まる。通常の usbmem-ci-<名前> は軽い 2 構成 (plain / wrel)。usbmem-ci-full-<名前> は 4 構成すべて、
#     usbmem-ci-only-<構成> (例: usbmem-ci-only-wsan) はその 1 構成だけ。統合前の最終確認は usbmem-ci-full-* で 4 構成を通すこと。
#   - ctest は並列 (-j)。FIXTURES / RESOURCE_LOCK が宣言済みなので依存は守られる。並列で落ちたテストは直列でやり直し、直列で通れば警告つきで通す
#     (並列で干渉するテストの目印として step summary に出す)。
name: Host tests

on:
  workflow_dispatch:
    inputs:
      ctest_regex:
        description: "ctest -R に渡す正規表現 (空なら全件)"
        required: false
        default: ""
      modes:
        description: "動かす構成 (空白区切り。既定は全部): plain san wsan wrel"
        required: false
        default: "plain san wsan wrel"
  push:
    branches: ['usbmem-ci*']

concurrency:
  group: host-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modes: ${{ steps.p.outputs.modes }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          INPUT_MODES: ${{ github.event.inputs.modes }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then m="${INPUT_MODES:-plain san wsan wrel}"
          else
            case "$REF" in
              usbmem-ci-only-*) m="${REF#usbmem-ci-only-}" ;;
              usbmem-ci-full*)  m="plain san wsan wrel" ;;
              *)                m="plain wrel" ;;
            esac
          fi
          for x in $m; do case "$x" in plain|san|wsan|wrel) ;; *) echo "未知の構成: $x" >&2; exit 1;; esac; done
          json=$(printf '%s\n' $m | jq -R . | jq -sc .)
          echo "modes=$json" >> "$GITHUB_OUTPUT"
          echo "構成: $json" | tee -a "$GITHUB_STEP_SUMMARY"

  host:
    name: host (${{ matrix.mode }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        mode: ${{ fromJSON(needs.plan.outputs.modes) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 e2fsprogs fuse2fs fuse3 mtools p7zip-full dosfstools exfatprogs exfat-fuse ntfs-3g \
            btrfs-progs xfsprogs f2fs-tools erofs-utils squashfs-tools zstd lzop lz4 xz-utils \
            gdisk fdisk bc genisoimage xorriso cryptsetup-bin nbdkit libnbd-bin qemu-utils partclone gddrescue zlib1g-dev
          echo user_allow_other | sudo tee -a /etc/fuse.conf

      # runner の /dev/shm は tmpfs (7.9 GB) に usrquota が付き、ユーザーのクォータが約 6.3 GB で EDQUOT ("Disk quota exceeded") になる (remount,size=… では広がらない)。
      # 全フィクスチャ (xfs・btrfs・blockdev 等) で 6 GB を超えるので、クォータなしの tmpfs を /dev/shm に重ねる。
      - name: Larger /dev/shm (no quota)
        run: |
          sudo mount -t tmpfs -o size=10G,mode=1777,nosuid,nodev tmpfs /dev/shm
          df -h /dev/shm

      # ubuntu 26.04 の runner は AppArmor の fusermount3 プロファイルが FUSE のマウント / アンマウントを /home・/mnt・/media・/tmp・/run/user の下に限る。
      # テストのフィクスチャ・作業場所は /dev/shm なので、fuse2fs / exfat-fuse の mount が "fusermount3: mount failed: Permission denied"、
      # ntfs-3g の mount 後の fusermount3 -u が "Operation not permitted" になる。ローカル上書き (local/fusermount3) で /dev/shm を足す。
      - name: Allow FUSE mounts under /dev/shm (AppArmor)
        run: |
          if [ -f /etc/apparmor.d/fusermount3 ] && command -v apparmor_parser >/dev/null; then
            sudo tee -a /etc/apparmor.d/local/fusermount3 >/dev/null <<'EOT'
          mount fstype=@{fuse_types} options=(nosuid,nodev) options in (ro,rw,noatime,dirsync,nodiratime,noexec,sync) -> /dev/shm/**/,
          umount /dev/shm/**/,
          EOT
            sudo apparmor_parser -r /etc/apparmor.d/fusermount3
          fi

      - name: Configure
        run: |
          flags=""; bt=Debug
          case "${{ matrix.mode }}" in
            san)  flags="-DUSBMEM_SANITIZE=ON" ;;
            wsan) flags="-DUSBMEM_SANITIZE=ON -DUSBMEM_NTFS_WRITE=ON" ;;
            wrel) flags="-DUSBMEM_NTFS_WRITE=ON"; bt=Release ;;
          esac
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=$bt $flags

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: ctest
        working-directory: build
        env:
          PATH_EXTRA: /sbin:/usr/sbin
          ASAN_OPTIONS: verify_asan_link_order=0:detect_leaks=1
          # gen_erofs_fixture.py: Ubuntu の erofs-utils の fsck.erofs が展開できない (fragments の) イメージの独立検証を省く (警告を出す)。Android CI と同じ
          USBMEM_FIXTURE_LENIENT: "1"
        run: |
          export PATH="$PATH:/sbin:/usr/sbin"
          re="${{ github.event.inputs.ctest_regex }}"
          sel=(); [ -z "$re" ] || sel=(-R "$re")
          jobs="${CTEST_JOBS:-4}"
          set +e
          ctest -j"$jobs" --output-on-failure "${sel[@]}"
          rc=$?
          if [ $rc -ne 0 ]; then
            cp Testing/Temporary/LastTestsFailed.log "$RUNNER_TEMP/failed_parallel.log" 2>/dev/null
            echo "::warning::並列 (-j$jobs) で失敗したテストを直列でやり直す"
            ctest --rerun-failed --output-on-failure
            rc=$?
            if [ $rc -eq 0 ]; then
              echo "::warning::直列では通った。並列で干渉するテストがある (step summary を参照)"
              { echo '### 並列 (-j'"$jobs"') で失敗し、直列で通ったテスト (${{ matrix.mode }})'; echo '```'; cat "$RUNNER_TEMP/failed_parallel.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          exit $rc

      # FAT 書き込みをカーネルの vfat と突き合わせる (loop マウントに sudo が要るので CI だけ。docs/fat-write.md)。フィクスチャは ctest の fat_gen_fixture が作る。
      # 書き込み有効のビルド (wrel) だけ。ctest_regex で絞った実行では走らせない (ただし fat_gen_fixture を含む絞り込みなら走らせる = このステップだけの素早い確認用)。
      # ctest が (FUSE / ntfs フィクスチャ等の既存の環境要因で) 失敗しても走らせる。
      - name: FAT write vs kernel vfat
        if: ${{ !cancelled() && matrix.mode == 'wrel' && (github.event.inputs.ctest_regex == '' || contains(github.event.inputs.ctest_regex, 'fat_gen_fixture')) }}
        run: |
          export PATH="$PATH:/sbin:/usr/sbin"
          sh tools/run_fat_kernel_tests.sh build/compat/usbmem_fat_write_tests "/dev/shm/usbmem_fat_$USER"

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log-${{ matrix.mode }}
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
