name: Host tests
on:
  push:
    branches: ['usbmem-ci*']
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ python3 e2fsprogs fuse2fs fuse3 mtools p7zip-full dosfstools exfatprogs exfat-fuse ntfs-3g \
            btrfs-progs xfsprogs f2fs-tools erofs-utils squashfs-tools zstd lzop lz4 xz-utils \
            gdisk fdisk bc genisoimage xorriso cryptsetup-bin nbdkit libnbd-bin qemu-utils partclone gddrescue zlib1g-dev
          echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: NTFS diag
        continue-on-error: true
        run: |
          ls -l /usr/bin/ntfs-3g /usr/bin/fusermount3; dpkg-statoverride --list | grep -i "ntfs\|fuse" || true
          cat /etc/fuse.conf; ls -ld /dev/shm /dev/fuse; id
          export PATH="$PATH:/sbin:/usr/sbin"
          D=/dev/shm/diag_ntfs; mkdir -p $D; truncate -s 64M $D/i.img; mkntfs -F -Q -q $D/i.img >/dev/null
          mkdir $D/m; ntfs-3g -o rw,compression $D/i.img $D/m; echo "mount rc=$?"
          grep -i "ntfs\|fuse" /proc/mounts
          fusermount3 -u $D/m; echo "fusermount3 -u rc=$?"
          grep -i "ntfs\|fuse" /proc/mounts || true
          umount $D/m; echo "umount rc=$?"
          sudo umount $D/m; echo "sudo umount rc=$?"
          echo ---- script in /dev/shm
          sh -x tools/gen_ntfs_fixture.sh /dev/shm/diag_ntfs2 2>&1 | tail -15; echo "rc=$?"
          echo ---- script in RUNNER_TEMP
          sh tools/gen_ntfs_fixture.sh $RUNNER_TEMP/diag_ntfs3 2>&1 | tail -5; echo "rc=$?"
          dpkg -l ntfs-3g exfatprogs | tail -3
      - name: Build
        run: |
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build -j"$(nproc)"
      - name: XFS diag
        continue-on-error: true
        run: |
          export PATH="$PATH:/sbin:/usr/sbin"
          mkfs.xfs -V
          python3 -I tools/gen_xfs_fixture.py /dev/shm/diag_xfs v5_bs64k 2>&1 | tail -5
          ls -l /dev/shm/diag_xfs | head
          build/compat/usbmem_xfs_tests /dev/shm/diag_xfs 2>&1 | tail -20
          # 比較用: 同じツリーを 4k でも
          python3 -I tools/gen_xfs_fixture.py /dev/shm/diag_xfs4 v5_default 2>&1 | tail -2
          build/compat/usbmem_xfs_tests /dev/shm/diag_xfs4 2>&1 | tail -5
      - name: partedit / disktools / erofs diag
        continue-on-error: true
        run: |
          export PATH="$PATH:/sbin:/usr/sbin"
          cd build && ctest --output-on-failure -R "partedit_tools|disktools_tools" 2>&1 | tail -40
