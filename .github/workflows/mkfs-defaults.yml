# 最新の mkfs の「既定」で作ったイメージの機能フラグが、自前実装 (XFS / Btrfs / F2FS) の対応表
# (tools/fs_feature_matrix.json) に載っているかを検査する (tools/check_mkfs_defaults.py)。
#   - 表に無い (新しい) フラグが既定で立った → 失敗。対応方針を決めて表と docs を直す。
#   - 既知の穴 (rmapbt / parent pointer など、書き込みを拒否する機能が既定で立っている) → 失敗にはせず、要約に出す。
# ubuntu-latest (ツールが古めの安定版) と Arch Linux (ローリングで最新に近い) の 2 つで見る。
# トリガ: workflow_dispatch、usbmem-mkfs-defaults ブランチへの push (host-tests / emulator が動かないよう usbmem-ci* の名前は避ける)、
#         週 1 回の schedule (GitHub の仕様で、schedule はリポジトリの既定ブランチにこのファイルがあるときだけ動く)。
name: mkfs defaults

on:
  workflow_dispatch:
  push:
    branches: ['usbmem-mkfs-defaults']
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  ubuntu:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install mkfs tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 xfsprogs btrfs-progs f2fs-tools
      - name: Check defaults
        run: |
          python3 tools/check_mkfs_defaults.py | tee "$RUNNER_TEMP/out.txt"
          { echo '### mkfs defaults (ubuntu-latest)'; echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  arch:
    name: Arch Linux (latest tools)
    runs-on: ubuntu-latest
    container: archlinux:latest
    timeout-minutes: 20
    steps:
      - name: Install mkfs tools
        run: pacman -Syu --noconfirm --needed git python xfsprogs btrfs-progs f2fs-tools
      - uses: actions/checkout@v7
      - name: Check defaults
        run: |
          python3 tools/check_mkfs_defaults.py | tee "$RUNNER_TEMP/out.txt"
          { echo '### mkfs defaults (Arch Linux)'; echo '```'; cat "$RUNNER_TEMP/out.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
