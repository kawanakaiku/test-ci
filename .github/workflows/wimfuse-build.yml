# libwimfuse.so (wimlib の wimmount を載せた別プロセスの実行ファイル。個人版の機能) を NDK でビルドできるかを素早く確認する専用ジョブ。docs/fuse-layer.md 10 章
# トリガ: workflow_dispatch、usbmem-wimfuse* ブランチへの push (usbmem-ci* の重い Host tests / emulator は動かさない)
name: wimfuse-build

on:
  workflow_dispatch:
  push:
    branches: ['usbmem-wimfuse*']

concurrency:
  group: wimfuse-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_VERSION: 30.0.16248370
  SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: SDK cache (NDK)
        id: sdk-cache
        uses: actions/cache@v5
        with:
          path: ${{ env.SDK_ROOT }}/ndk/${{ env.NDK_VERSION }}
          key: sdk-ndk-only-${{ runner.os }}-${{ env.NDK_VERSION }}

      - name: Install NDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"

      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build make curl libfuse3-dev

      - name: Build libwimfuse.so (arm64-v8a, x86_64)
        run: |
          export ANDROID_NDK_HOME="$SDK_ROOT/ndk/$NDK_VERSION"
          tools/wimfuse/build_android.sh "$RUNNER_TEMP/wimfuse" 2>&1 | tee "$RUNNER_TEMP/wimfuse_build.log"
          test "${PIPESTATUS[0]}" = 0

      - name: Result
        if: always()
        run: |
          { echo '### libwimfuse.so'; echo '```'; ls -l "$RUNNER_TEMP"/wimfuse/jniLibs/*/libwimfuse.so 2>&1; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Save libs and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wimfuse-build
          path: |
            ${{ runner.temp }}/wimfuse/jniLibs
            ${{ runner.temp }}/wimfuse/work/build-*/configure.log
            ${{ runner.temp }}/wimfuse/work/build-*/make.log
            ${{ runner.temp }}/wimfuse_build.log
          if-no-files-found: ignore
          retention-days: 7
