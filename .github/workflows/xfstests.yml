# xfstests (fstests) で自前実装の FS を試す (docs/xfstests.md)。core の FS API を FUSE で見せる usbmem_fuse (tools/fuse/usbmem_fuse.cpp) を
# runner でビルドし、FSTYP=fuse / FUSE_SUBTYP=.usbmem で fstests の generic/ を 1 件ずつ実行して、pass / fail / notrun / hang と
# アンマウント時の fsck の結果を記録する (tools/fuse/run_xfstests.py)。
# トリガ: workflow_dispatch、usbmem-xfstests* ブランチへの push (usbmem-ci* は重い Host tests / emulator が動くので使わない)。
name: xfstests

on:
  workflow_dispatch:
    inputs:
      fs_json:
        description: 'FS の JSON 配列 (ext4 ext2 fat exfat ntfs xfs btrfs f2fs)'
        default: '["ext4"]'
      group:
        description: 'fstests のグループ (tests が空のとき)'
        default: 'quick'
      tests:
        description: 'カンマ区切りのテスト名 (空 = グループ全部)'
        default: ''
      mount_opts:
        description: 'usbmem_fuse の -o'
        default: 'allow_other,default_permissions,quiet_setattr'
      timeout:
        description: '1 件あたりの秒数'
        default: '300'
      loop:
        description: 'TEST / SCRATCH をループデバイスにする (true / false。ブロックデバイス前提・dm-flakey・dm-error のテストが動く)'
        default: 'true'
  push:
    branches: ['usbmem-xfstests*']

concurrency:
  group: xfstests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # ブランチ名の末尾が -progress のときだけ、進捗を ci-progress ブランチへ書く (tools/ci/push_progress.sh)

env:
  FSTESTS_TAG: v2026.11.10

jobs:
  plan:
    # push のときは、ブランチ名で FS とテストの範囲を決める (usbmem-xfstests-<fs>[-smoke] / usbmem-xfstests-all[-smoke]。それ以外は ext4 のスモーク)。
    # workflow_dispatch はワークフローが既定ブランチにあるリポジトリでしか手動実行できないので、push が主な起動方法。
    runs-on: ubuntu-latest
    outputs:
      fs_json: ${{ steps.p.outputs.fs_json }}
      tests: ${{ steps.p.outputs.tests }}
      group: ${{ steps.p.outputs.group }}
      mount_opts: ${{ steps.p.outputs.mount_opts }}
      timeout: ${{ steps.p.outputs.timeout }}
      trace: ${{ steps.p.outputs.trace }}
      extra: ${{ steps.p.outputs.extra }}
      progress: ${{ steps.p.outputs.progress }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          IN_FS: ${{ inputs.fs_json }}
          IN_GROUP: ${{ inputs.group }}
          IN_TESTS: ${{ inputs.tests }}
          IN_MOUNT: ${{ inputs.mount_opts }}
          IN_TIMEOUT: ${{ inputs.timeout }}
          IN_LOOP: ${{ inputs.loop }}
        run: |
          SMOKE='generic/001,generic/002,generic/005,generic/006,generic/007,generic/010,generic/011,generic/013,generic/023,generic/024,generic/035,generic/075,generic/091,generic/112'
          # --loop (ループデバイス) にしたときだけ notrun でなくなるテスト (dm-flakey / dm-error / ブロックデバイス前提)。ブランチ名の -loopset で、これだけを --loop で動かす
          LOOPSET='generic/034,generic/039,generic/040,generic/041,generic/056,generic/057,generic/065,generic/067,generic/073,generic/076,generic/090,generic/101,generic/104,generic/106,generic/107,generic/108,generic/321,generic/322,generic/325,generic/335,generic/336,generic/338,generic/341,generic/342,generic/343,generic/348,generic/366,generic/376,generic/409,generic/410,generic/411,generic/441,generic/450,generic/480,generic/481,generic/484,generic/498,generic/502,generic/510,generic/526,generic/527,generic/534,generic/538,generic/547,generic/552,generic/557,generic/563,generic/640,generic/690,generic/704,generic/731,generic/740,generic/741,generic/764,generic/771,generic/779,generic/782,generic/784,generic/785,generic/789,generic/790'
          ALL='["ext4","ext2","fat","exfat","ntfs","xfs","btrfs","f2fs"]'
          progress=0; extra='--loop'; custom=''; trace=0; fs='["ext4"]'; tests="$SMOKE"; group=quick; mopts='allow_other,default_permissions,quiet_setattr'; to=300
          if [ "$EVENT" = workflow_dispatch ]; then
            fs=$IN_FS; tests=$IN_TESTS; group=$IN_GROUP; mopts=$IN_MOUNT; to=$IN_TIMEOUT; if [ "$IN_LOOP" = false ]; then extra=''; fi
          else
            name=${REF#usbmem-xfstests-}
            case "$name" in *-progress) progress=1; name=${name%-progress} ;; esac
            strict=0; case "$name" in *-strict) strict=1; name=${name%-strict} ;; esac
            smoke=0; case "$name" in *-smoke) smoke=1; name=${name%-smoke} ;; esac
            # -t<番号>_<番号>... : 指定した generic テストだけ (例 usbmem-xfstests-xfs-t023_024)
            case "$name" in *-t[0-9]*) sel=${name##*-t}; name=${name%-t*}; tests=$(echo "$sel" | tr '_' '\n' | sed 's|^|generic/|' | paste -sd,); smoke=1; trace=1; custom=1 ;; esac
            # 既定は --loop (ループデバイス)。-noloop で外す (イメージファイルをそのまま使う従来の動き)。-loopset は --loop でだけ動くテストの集合だけを動かす
            case "$name" in *-loopset) name=${name%-loopset}; tests=$LOOPSET; smoke=1; custom=1 ;; esac
            case "$name" in *-noloop) extra=''; name=${name%-noloop} ;; esac
            case "$name" in *-loop) name=${name%-loop} ;; esac
            case "$name" in *-noremkfs) extra="$extra --no-remkfs"; name=${name%-noremkfs} ;; esac
            case "$name" in *-trace) trace=1; smoke=1; name=${name%-trace} ;; esac
            case "$name" in
              all) fs=$ALL ;;
              ext4|ext2|fat|exfat|ntfs|xfs|btrfs|f2fs) fs="[\"$name\"]" ;;
              *) smoke=1 ;;
            esac
            [ $smoke = 1 ] || tests=''
            [ "$trace" = 1 ] && [ -z "$custom" ] && tests='generic/001,generic/002,generic/003,generic/005'
            [ $strict = 1 ] && mopts='allow_other,default_permissions'
          fi
          echo "fs_json=$fs" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "group=$group" >> "$GITHUB_OUTPUT"
          echo "mount_opts=$mopts" >> "$GITHUB_OUTPUT"
          echo "timeout=$to" >> "$GITHUB_OUTPUT"
          echo "trace=$trace" >> "$GITHUB_OUTPUT"
          echo "extra=$extra" >> "$GITHUB_OUTPUT"
          echo "progress=$progress" >> "$GITHUB_OUTPUT"
          echo "fs=$fs tests=$tests group=$group mount_opts=$mopts"

  xfstests:
    name: xfstests ${{ matrix.fs }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        fs: ${{ fromJSON(needs.plan.outputs.fs_json) }}
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build g++ pkg-config python3 zlib1g-dev libfuse3-dev fuse3 \
            e2fsprogs xfsprogs btrfs-progs f2fs-tools dosfstools exfatprogs ntfs-3g \
            build-essential libtool-bin automake autoconf gawk bc acl attr psmisc uuid-dev libuuid1 xfslibs-dev libacl1-dev libattr1-dev libaio-dev \
            libgdbm-dev libcap-dev liburing-dev libssl-dev libgdbm-compat-dev fio dbench sqlite3 indent libmount-dev dmsetup
          ls -l /dev/fuse; uname -r; id
          mkfs.ext4 -V 2>&1 | head -1; mkfs.xfs -V; mkfs.btrfs --version; mkfs.f2fs -V 2>&1 | head -1 || true

      - name: Build usbmem_fuse
        run: |
          cmake -S core -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DUSBMEM_NTFS_WRITE=ON -DUSBMEM_BUILD_TESTS=OFF -DUSBMEM_BUILD_FUSE=ON
          cmake --build build --target usbmem_fuse usbmem_fscheck -j"$(nproc)"
          sudo install -m 0755 build/usbmem_fuse /usr/local/bin/usbmem_fuse
          sudo install -m 0755 build/usbmem_fscheck /usr/local/bin/usbmem_fscheck
          usbmem_fuse --help || true

      - name: Probe loop / device-mapper support
        continue-on-error: true
        run: |
          # ブロックデバイス前提の fstests (valid block disk / dm-flakey など) を動かせるかの確認 (docs/xfstests.md「ブロックデバイス」)
          sudo losetup -f --show /dev/null 2>&1 | head -2 || true
          truncate -s 64M "$RUNNER_TEMP/probe.img"; L=$(sudo losetup -f --show "$RUNNER_TEMP/probe.img") && echo "loop: $L" && sudo blockdev --getsz "$L" && sudo blkdiscard -f "$L" && echo "blkdiscard ok"; sudo losetup -d "$L" || true
          sudo modprobe dm-flakey 2>&1 | head -2; sudo modprobe dm-error 2>&1 | head -2; sudo modprobe dm-snapshot 2>&1 | head -2
          sudo dmsetup targets 2>&1 | head -30
          ls /lib/modules/$(uname -r)/kernel/drivers/md 2>&1 | head -30

      - name: Smoke test
        continue-on-error: true
        run: sudo tools/fuse/smoke.sh ${{ matrix.fs }} /usr/local/bin/usbmem_fuse

      - name: Build fstests
        run: |
          # kernel.org は接続できないことがある (接続待ちが 2 分以上かかる) ので、短いタイムアウトで複数のミラーを順に試す
          ok=0
          for i in 1 2 3; do
            for url in https://git.kernel.org/pub/scm/fs/xfs/xfstests-dev.git https://kernel.googlesource.com/pub/scm/fs/xfs/xfstests-dev; do
              rm -rf "$RUNNER_TEMP/fstests"
              if timeout 120 git clone --depth 1 --branch "$FSTESTS_TAG" "$url" "$RUNNER_TEMP/fstests"; then ok=1; break 2; fi
              sleep 3
            done
          done
          [ $ok = 1 ] || { echo "::warning::固定タグを取得できなかったので GitHub ミラーの既定ブランチを使う"; rm -rf "$RUNNER_TEMP/fstests"; git clone --depth 1 https://github.com/kdave/xfstests.git "$RUNNER_TEMP/fstests"; }
          cd "$RUNNER_TEMP/fstests"
          make -j"$(nproc)" >"$RUNNER_TEMP/fstests_build.log" 2>&1 || { tail -50 "$RUNNER_TEMP/fstests_build.log"; exit 1; }
          for u in fsgqa fsgqa2 123456-fsgqa; do id "$u" >/dev/null 2>&1 || sudo useradd -m -U "$u"; done
          sudo mkdir -p /mnt/usbmem_xfstests && sudo chmod 755 /mnt/usbmem_xfstests
          df -h /mnt | cat

      - name: Run fstests
        # 通常は 1 FS 30 分ほど。止まったテストがあっても結果を拾えるように、ステップに上限を付ける (打ち切られても次の Upload は always() で動く。results.json は 1 件ごとに書く)
        timeout-minutes: 120
        env:
          FSTESTS_GROUP: ${{ needs.plan.outputs.group }}
          FSTESTS_TESTS: ${{ needs.plan.outputs.tests }}
          MOUNT_OPTS: ${{ needs.plan.outputs.mount_opts }}
          TEST_TIMEOUT: ${{ needs.plan.outputs.timeout }}
          TRACE: ${{ needs.plan.outputs.trace }}
          EXTRA: ${{ needs.plan.outputs.extra }}
          PROGRESS: ${{ needs.plan.outputs.progress }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          # ランナーごと止まったとき (The hosted runner lost communication) の原因調査用: 実行中のテストなどを 30 秒ごとに ci-progress ブランチへ書く
          if [ "$PROGRESS" = 1 ]; then tools/ci/push_progress.sh "${{ github.run_id }}-${{ matrix.fs }}" "$RUNNER_TEMP/out" 30 >/dev/null 2>&1 & fi
          TR=USBMEM_FUSE_TRACE=0; [ "$TRACE" = 1 ] && TR=USBMEM_FUSE_TRACE=1
          sudo env "$TR" python3 tools/fuse/run_xfstests.py --fs ${{ matrix.fs }} --fstests "$RUNNER_TEMP/fstests" --out "$RUNNER_TEMP/out" \
            --group "$FSTESTS_GROUP" --tests "$FSTESTS_TESTS" --mount-opts "$MOUNT_OPTS" --timeout "$TEST_TIMEOUT" --max-seconds 18000 $EXTRA
          cat "$RUNNER_TEMP/out/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup (fuse / dm / loop)
        if: always()
        run: |
          # ランナーが原因不明で止まる・後始末の git が SIGBUS (135) で落ちることがあったので、アップロードの前に FUSE のマウント・dm・ループを確実に外す
          sudo pkill -x usbmem_fuse || true
          for m in $(awk '$3 ~ /^fuse/ {print $2}' /proc/mounts); do sudo umount -l "$m" || true; done
          sudo dmsetup remove_all --force 2>/dev/null || true
          sudo losetup -D 2>/dev/null || true
          sudo dmesg 2>/dev/null | tail -30 > "$RUNNER_TEMP/out/dmesg-tail.txt" || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfstests-${{ matrix.fs }}
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore
